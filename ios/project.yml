name: SakamichiBlogPDF
options:
  bundleIdPrefix: com.mamahiro3581
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1,2"
packages:
  GoogleMobileAds:
    url: https://github.com/googleads/swift-package-manager-google-mobile-ads.git
    exactVersion: 13.5.0
targets:
  SakamichiBlogPDF:
    type: application
    platform: iOS
    sources:
      - path: SakamichiBlogPDF
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mamahiro3581.SakamichiBlogPDF
        INFOPLIST_FILE: SakamichiBlogPDF/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
    dependencies:
      - package: GoogleMobileAds
    scheme:
      testTargets:
        - SakamichiBlogPDFTests
  SakamichiBlogPDFTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: SakamichiBlogPDFTests
    dependencies:
      - target: SakamichiBlogPDF
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mamahiro3581.SakamichiBlogPDFTests
