<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sakamichi Blog PDF</title>
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <div>
          <p class="eyebrow">OFFICIAL BLOG PDF</p>
          <h1>Sakamichi Blog PDF</h1>
        </div>
        <div class="topbar-actions">
          <label class="group-control">
            <span>グループ</span>
            <select id="groupSelect" aria-label="取得するグループ">
              <option value="hinata" selected>日向坂46</option>
              <option value="sakura">櫻坂46</option>
              <option value="keyaki">欅坂46</option>
              <option value="nogi">乃木坂46</option>
            </select>
          </label>
          <a id="officialLink" class="ghost-link" href="https://www.hinatazaka46.com/s/official/?ima=0000" target="_blank" rel="noreferrer">公式サイト</a>
          <span id="status" class="status" role="status">準備中</span>
        </div>
      </header>

      <main class="workspace">
        <aside class="sidebar" aria-label="メンバー">
          <section class="panel member-panel">
            <div class="panel-head">
              <h2>メンバー</h2>
              <span id="memberCount" class="count">0</span>
            </div>
            <div id="memberSelect" class="member-select">
              <button
                id="memberDropdownButton"
                class="member-dropdown-button"
                type="button"
                aria-expanded="false"
                aria-controls="memberDropdown"
              >
                <span id="memberSelectionLabel">メンバーを選択</span>
                <span class="member-dropdown-arrow" aria-hidden="true"></span>
              </button>
              <div id="memberDropdown" class="member-dropdown" hidden>
                <input id="memberSearch" class="search" type="search" placeholder="メンバー検索" autocomplete="off" />
                <div class="member-dropdown-actions">
                  <button id="selectAllMembers" class="secondary" type="button">表示中を全選択</button>
                  <button id="clearMembers" class="secondary" type="button">すべて解除</button>
                </div>
                <div id="memberList" class="member-list" role="group" aria-label="メンバー候補"></div>
                <button id="closeMemberDropdown" class="primary member-dropdown-close" type="button">選択完了</button>
              </div>
            </div>
          </section>

          <section class="panel options-panel">
            <div class="panel-head">
              <h2>取得</h2>
            </div>
            <button id="loadBlogs" class="primary wide" type="button">ブログ取得</button>
          </section>
        </aside>

        <section class="content" aria-label="ブログ">
          <div class="toolbar">
            <div>
              <h2>ブログ</h2>
              <span id="blogSummary" class="muted">0件</span>
            </div>
            <div class="toolbar-actions">
              <label class="page-size-control">
                <span>表示</span>
                <select id="blogPageSize" aria-label="ブログ表示件数">
                  <option value="10" selected>10件</option>
                  <option value="30">30件</option>
                  <option value="60">60件</option>
                </select>
              </label>
              <button id="selectAllBlogs" class="secondary" type="button" disabled>全選択</button>
              <button id="clearBlogs" class="secondary" type="button" disabled>解除</button>
              <button id="downloadBlogs" class="primary" type="button" disabled>選択PDF保存</button>
            </div>
          </div>

          <div class="blog-list-wrap">
            <div id="emptyState" class="empty-state">メンバーを選んでブログを取得してください</div>
            <div id="blogList" class="blog-list" aria-live="polite"></div>
            <nav id="pagination" class="pagination" aria-label="ブログページ" hidden>
              <button id="prevBlogPage" class="secondary page-step" type="button" aria-label="前のページ">前へ</button>
              <div id="paginationPages" class="pagination-pages"></div>
              <button id="nextBlogPage" class="secondary page-step" type="button" aria-label="次のページ">次へ</button>
            </nav>
          </div>
        </section>
      </main>
    </div>
    <div id="pdfRenderStage" class="pdf-render-stage" aria-hidden="true"></div>
    <script src="/vendor/html2pdf.bundle.min.js" defer></script>
    <script src="/vendor/jszip.min.js" defer></script>
    <script src="/app.js" defer></script>
  </body>
</html>
